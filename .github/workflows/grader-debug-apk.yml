# Fork-only workflow (not from upstream Saber).
# Checks the grader (lib/grading), builds a debug APK and publishes it as a
# GitHub pre-release so it can be installed from a tablet's browser.
#
# Signing: every build must use the same key, or an update will not install
# over the previous build. By default the APK is signed with the keystore that
# is committed upstream (android/fallback-key.jks), which is fixed but public.
# To use a private key instead, set the repository secrets SIGNING_KEY (base64
# of the keystore), KEY_STORE_PASSWORD, KEY_PASSWORD and ALIAS. Switching keys
# requires uninstalling the app once (export your notes first).
name: Grader debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  # Run on: manual dispatch, every push to main, and pushes to other branches
  # only when this workflow file itself changed.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            run=true
          elif ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            # New branch or force push: no previous commit to compare with.
            run=true
          elif git diff --name-only "$BEFORE" HEAD | grep -qx ".github/workflows/grader-debug-apk.yml"; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    name: Check grader and build debug APK
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to publish the pre-release
    # Only builds cancel each other; a push that skips the build must not
    # cancel a build that is still running.
    concurrency:
      group: grader-debug-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Setup keystore (optional, see the top of this file)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/android.keystore
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=../android.keystore"
          } > android/key.properties

      # Keep these values in sync with upstream's .github/workflows/android.yml.
      - name: Setup Android build tools
        run: |
          ANDROID_NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV

          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> $GITHUB_ENV

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      # A shallow submodule clone without its tag makes Flutter report
      # 0.0.0-unknown, and then `pub get` fails with a confusing error.
      - name: Check the Flutter version is known
        run: |
          flutter --version
          if flutter --version | grep -q "0.0.0-unknown"; then
            echo "::error::Flutter version is unknown: the submodule's version tag was not fetched."
            exit 1
          fi

      - run: flutter pub get

      - name: Analyze grader
        run: flutter analyze --no-pub lib/grading test/grading

      - name: Test grader
        run: flutter test --no-pub test/grading

      - name: Build debug apk
        run: flutter build apk --debug --dart-define=UPDATE_CHECK="false"

      - name: Rename apk
        id: rename_apk
        run: |
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          apkName="Saber_Grader_debug_v${buildName}_${GITHUB_SHA::7}.apk"
          echo "apkName=$apkName" >> $GITHUB_OUTPUT

          mkdir -p output
          mv build/app/outputs/flutter-apk/app-debug.apk output/$apkName

          # The signing certificate must be the same for every build.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certSha256=$("$apksigner" verify --print-certs output/$apkName | grep -m 1 "SHA-256" | awk '{print $NF}')
          echo "Signing certificate SHA-256: $certSha256"
          echo "certSha256=$certSha256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Saber-Grader-debug-apk
          path: output/${{ steps.rename_apk.outputs.apkName }}
          if-no-files-found: error

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: output/${{ steps.rename_apk.outputs.apkName }}
          CERT: ${{ steps.rename_apk.outputs.certSha256 }}
        run: |
          tag="grader-${GITHUB_RUN_NUMBER}"
          {
            echo "Debug build of Saber Grader (app id dev.ilgax.saber), built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}."
            echo
            echo "To install: open this page on the tablet and tap the .apk file below."
            echo
            echo "Signing certificate SHA-256: ${CERT}"
          } > notes.md
          gh release create "$tag" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Saber Grader debug build ${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md
